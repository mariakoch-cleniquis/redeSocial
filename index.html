<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Social Media</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="phone-frame">
        <div class="phone-screen">

            <!-- Cabeçalho -->
            <div class="post-header">
                <div class="user-info">
                    <img class="avatar-small" src="https://i.pinimg.com/736x/35/81/58/358158f9a2c443617b8180fee40d936c.jpg" alt="Avatar">
                    <span class="username">Psicóloga Maria</span>
                </div>
            </div>

            <!-- Mídia -->
            <div class="post-media">
                <img class="main-img" src="https://i.pinimg.com/736x/a6/ed/29/a6ed29dd6616b5afa31856cebcaaee5f.jpg" alt="Post photo">
            </div>

            <!-- Ações -->
            <div class="post-actions">
                <div class="left-actions">
                    <!-- BOTÃO DE CURTIR COM ID -->
                    <button class="action-btn" id="like-btn" type="button">
                        <svg viewBox="0 0 24 24">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.78-8.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                        <span id="like-count">1200</span>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- O SCRIPT DEVE ESTAR AQUI NO FINAL -->
    <script src="script.js"></script>
</body>
</html>
